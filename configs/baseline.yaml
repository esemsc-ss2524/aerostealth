geometry:
  airfoil: NACA0012
  chord: 1.0
  cst_coeffs: 8
  constraints:
    thickness_min: 0.02
    thickness_max: 0.16
    trailing_edge_gap_max: 1.0e-3
    enclosed_area_min: 0.075

aero:
  reynolds: 1.0e6
  mach: 0.15
  cl_target: 0.4
  trim: newton_aoa
  solver: openfoam

em:
  frequency_hz: 10.0e9
  chord_m: 0.05
  polarization: TM
  measurement: monostatic
  incidence_deg: [-30.0, 30.0]
  incidence_count: 13
  ks_rho: 50.0

normalization:
  cd_ref: 1.3e-2
  sigma_ref: 1.0e-2
